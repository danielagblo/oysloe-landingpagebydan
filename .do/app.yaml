version: 1

name: oysloe-landing-page
services:
  # Frontend React App
  - name: frontend
    source_dir: /
    github:
      repo: danielagblo/oysloe-landingpagebydan
      branch: main
    run_command: npm run build && npx serve -s dist -l 3000
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
    build_command: npm ci && npm run build

  # Backend Django API
  - name: backend
    source_dir: /backend
    github:
      repo: danielagblo/oysloe-landingpagebydan
      branch: main
    run_command: gunicorn project.wsgi:application --config gunicorn_config.py
    environment_slug: python
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /admin
      - path: /static
      - path: /media
    envs:
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings_production
      - key: DJANGO_SECRET_KEY
        value: ${DJANGO_SECRET_KEY}
      - key: DB_NAME
        value: ${DB_NAME}
      - key: DB_USER
        value: ${DB_USER}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_PORT
        value: ${DB_PORT}
      - key: PRODUCTION_DOMAIN
        value: ${PRODUCTION_DOMAIN}
    build_command: pip install -r requirements.txt
    http_port: 5000

databases:
  - name: oysloe-db
    engine: PG
    version: "13"
    size: db-s-dev-database
    num_nodes: 1