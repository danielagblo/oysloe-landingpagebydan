name: oysloelandingpage
region: nyc

services:
  - name: backend
    github:
      repo: danielagblo/oysloe-landingpagebydan
      branch: main
      deploy_on_push: true
    
    source_dir: /
    
    build_command: bash backend/build.sh
    
    run_command: gunicorn backend.project.wsgi:application --chdir backend --config backend/gunicorn_config.py
    
    environment_slug: python
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    envs:
      - key: PYTHONPATH
        value: "/app/backend"
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "oysloelandingpage-cw9m3.ondigitalocean.app"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: CORS_ALLOWED_ORIGINS
        value: "https://oysloelandingpage-cw9m3.ondigitalocean.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: db
    engine: PG
    version: "12"
